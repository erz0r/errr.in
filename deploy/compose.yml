  errrin:
    image: nginx:alpine
    container_name: errrin
    volumes:
      - ~/errr.in:/usr/share/nginx/html:ro
      - ~/docker/errrin/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
  errrin-inbox:
    image: node:22-alpine
    container_name: errrin-inbox
    user: "1000:1000"
    command: ["node", "/app/inbox.mjs"]
    read_only: true
    # the bot token and erin's discord id come from the log bot's env file
    env_file: [errrin/inbox.env, errrin/log.env]
    volumes:
      - ~/docker/errrin/inbox.mjs:/app/inbox.mjs:ro
      - ~/docker/errrin/discord.mjs:/app/discord.mjs:ro
      - ~/errr.in-inbox:/data
    restart: unless-stopped
  errrin-log:
    image: node:22-alpine
    container_name: errrin-log
    user: "1000:1000"
    command: ["node", "/app/log.mjs"]
    read_only: true
    env_file: errrin/log.env
    volumes:
      - ~/docker/errrin/log.mjs:/app/log.mjs:ro
      - ~/docker/errrin/discord.mjs:/app/discord.mjs:ro
      - ~/errr.in-log:/data
    restart: unless-stopped
