  errrin:
    image: nginx:alpine
    container_name: errrin
    volumes:
      - ~/errr.in:/usr/share/nginx/html:ro
      - ~/docker/errrin/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
  errrin-inbox:
    image: node:22-alpine
    container_name: errrin-inbox
    user: "1000:1000"
    command: ["node", "/app/inbox.mjs"]
    read_only: true
    env_file: errrin/inbox.env
    volumes:
      - ~/docker/errrin/inbox.mjs:/app/inbox.mjs:ro
      - ~/errr.in-inbox:/data
    restart: unless-stopped
