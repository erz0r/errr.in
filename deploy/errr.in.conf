server {
    listen 80;
    listen [::]:80;
    server_name errr.in www.errr.in;
    return 301 https://errr.in$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.errr.in;
    ssl_certificate /etc/letsencrypt/live/errr.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/errr.in/privkey.pem;
    return 301 https://errr.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name errr.in;
    ssl_certificate /etc/letsencrypt/live/errr.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/errr.in/privkey.pem;

    root /var/www/errr/site;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location /media/ {
        add_header Cache-Control "public, max-age=604800";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
