limit_req_zone $http_cf_connecting_ip zone=inbox:1m rate=3r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html/site;
    index index.html;
    error_page 403 404 =404 /404.html;
    absolute_redirect off;
    server_tokens off;
    autoindex off;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://ws.audioscrobbler.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ /\. {
        return 404;
    }

    location = /api/message {
        limit_req zone=inbox burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        resolver 127.0.0.11 valid=30s;
        set $inbox http://errrin-inbox:8080;
        proxy_pass $inbox;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    location /media/ {
        expires 7d;
    }
}
