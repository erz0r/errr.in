limit_req_zone $http_cf_connecting_ip zone=inbox:1m rate=3r/m;
limit_conn_zone $http_cf_connecting_ip zone=logstream:1m;

server {
    listen 80;
    listen [::]:80;
    server_name www.errr.in;
    return 301 https://errr.in$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html/site;
    index index.html;
    error_page 403 404 =404 /404.html;
    absolute_redirect off;
    server_tokens off;
    charset utf-8;
    autoindex off;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml model/gltf-binary;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://ws.audioscrobbler.com https://cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ /\. {
        return 404;
    }

    location = /api/message {
        limit_req zone=inbox burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        resolver 127.0.0.11 valid=30s;
        set $inbox http://errrin-inbox:8080;
        proxy_pass $inbox;
    }

    location = /api/log/stream {
        limit_except GET {
            deny all;
        }
        limit_conn logstream 4;
        resolver 127.0.0.11 valid=30s;
        set $log http://errrin-log:8080;
        proxy_pass $log;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }

    location /api/log {
        limit_except GET {
            deny all;
        }
        resolver 127.0.0.11 valid=30s;
        set $log http://errrin-log:8080;
        proxy_pass $log;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    location /media/ {
        expires 7d;
    }

    # nginx's mime.types has no entry for 3d models; a types block here only affects .glb
    location ~ ^/media/.+\.glb$ {
        types { model/gltf-binary glb; }
        expires 7d;
    }
}
